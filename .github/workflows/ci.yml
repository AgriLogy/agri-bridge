name: CI

# npm ci + npm test (vitest) on Node 20 via the shared node-test workflow.
# Thin caller — the logic lives in AgriLogy/shared-workflows.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: AgriLogy/shared-workflows/.github/workflows/node-test.yml@v1
    with:
      node_version: "20"
